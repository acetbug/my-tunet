[package]
name = "my-tunet"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
hmac = "0.13.0"
keyring = "4.1.6"
md-5 = "0.11.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["query", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha-1 = "0.10.1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
